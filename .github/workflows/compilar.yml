name: Compilar Tienda PS4

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código de la tienda
        uses: actions/checkout@v4

      - name: Preparar entorno
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip curl
          
          # Descargar orbis-pub-cmd nativo de Linux desde una fuente alterna
          wget -qO orbis-pub-cmd-linux.zip "https://github.com/Gkiokan/ps4-mac-pkg-builder/archive/refs/heads/master.zip"
          unzip -q orbis-pub-cmd-linux.zip
          
          # Mover la herramienta a un lugar cómodo
          mkdir tools
          cp ps4-mac-pkg-builder-master/pkg-build/linux/orbis-pub-cmd tools/
          chmod +x tools/orbis-pub-cmd

      - name: Obtener Base WebKit de PS4
        run: |
          mkdir -p build_base/sce_sys/about
          # Ya tenemos el zip descargado del paso anterior
          cp -r ps4-mac-pkg-builder-master/pkg-build/sce_sys/* build_base/sce_sys/
          cp ps4-mac-pkg-builder-master/pkg-build/eboot.bin build_base/

      - name: Inyectar Código Fuente
        run: |
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Generar archivo de proyecto (.gp4)
        run: |
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF

      - name: Compilar el .PKG
        run: |
          # Usamos la versión de Linux, cero Wine, cero errores
          ./tools/orbis-pub-cmd img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
