name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código de la tienda
        uses: actions/checkout@v4

      - name: Instalar Dependencias (Wine + Linux)
        run: |
          echo "==> Configurando entorno..."
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y wine64 wine32 wget curl git unzip

      - name: Escanear FPKG Tools (Bypass DMCA)
        run: |
          echo "==> Cazando herramientas FPKG en la scene..."
          # Array de repositorios grandes y seguros
          TOOLS_REPOS=(
            "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87.git"
            "https://github.com/theheroGAC/ps4-fake-pkg-tools.git"
            "https://github.com/illusion0001/ps4-fake-pkg-tools.git"
          )
          
          for repo in "${TOOLS_REPOS[@]}"; do
            echo "Probando $repo..."
            if git clone --depth 1 "$repo" tools_fpkg; then 
              echo "==> Herramientas obtenidas con éxito."
              break
            fi
          done
          
          # Encontrar la ruta exacta del .exe sin importar la estructura del repo
          CMD_PATH=$(find tools_fpkg -name "orbis-pub-cmd.exe" | head -n 1)
          echo "Ejecutable encontrado en: $CMD_PATH"
          echo "CMD_PATH=$CMD_PATH" >> $GITHUB_ENV

      - name: Escanear WebKit Wrapper (Bypass DMCA)
        run: |
          echo "==> Cazando WebKit eboot base..."
          mkdir -p build_base/sce_sys/about
          
          WRAPPER_REPOS=(
            "https://github.com/Scene-Stars/PS4-Web-Wrapper.git"
            "https://github.com/RetroGamer74/PS4-Web-Wrapper.git"
            "https://github.com/B-Dem/PS4-Web-Wrapper.git"
          )
          
          for repo in "${WRAPPER_REPOS[@]}"; do
            echo "Probando $repo..."
            if git clone --depth 1 "$repo" wrapper_repo; then 
              echo "==> WebKit Wrapper obtenido con éxito."
              break
            fi
          done
          
          # Extraer archivos vitales
          EBOOT_PATH=$(find wrapper_repo -name "eboot.bin" | head -n 1)
          SFO_PATH=$(find wrapper_repo -name "param.sfo" | head -n 1)
          
          cp "$EBOOT_PATH" build_base/eboot.bin
          cp "$SFO_PATH" build_base/sce_sys/param.sfo || true

      - name: Inyectar Tu Tienda
        run: |
          echo "==> Moviendo tus archivos de la tienda..."
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Escribir configuration project.gp4
        run: |
          echo "==> Creando mapa del PKG..."
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <application_param>
                <content_id>IV0000-ROXZ00000_00-RONIXZSTORE00000</content_id>
                <title_id>ROXZ00000</title_id>
              </application_param>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF

      - name: Generar icono genérico
        run: |
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > build_base/sce_sys/icon0.png

      - name: Compilar PKG Final
        run: |
          echo "==> Empaquetando todo en RonixzStore.pkg..."
          # Ejecuta el binario exacto que encontró el radar usando Wine
          wine "$CMD_PATH" img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
