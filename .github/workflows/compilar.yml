name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar tu código
        uses: actions/checkout@v4

      - name: Ensamblar Motor y Compilar PKG
        run: |
          echo "==> Instalando dependencias..."
          sudo apt-get update -y
          sudo apt-get install -y git

          echo "==> Clonando motor base (WebKit)..."
          # git clone saca la rama por defecto sin importar si es main o master
          git clone --depth 1 https://github.com/Gkiokan/ps4-mac-pkg-builder.git builder_repo
          
          echo "==> Preparando orbis-pub-cmd..."
          mkdir tools
          cp builder_repo/pkg-build/linux/orbis-pub-cmd tools/
          chmod +x tools/orbis-pub-cmd
          
          echo "==> Armando estructura del juego..."
          mkdir -p build_base/sce_sys/about
          cp -r builder_repo/pkg-build/sce_sys/* build_base/sce_sys/
          cp builder_repo/pkg-build/eboot.bin build_base/
          
          echo "==> Inyectando tu Tienda HTML..."
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/
          
          echo "==> Escribiendo project.gp4..."
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF
          
          echo "==> Empaquetando PKG..."
          ./tools/orbis-pub-cmd img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG Final
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
