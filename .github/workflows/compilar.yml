name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código de la tienda
        uses: actions/checkout@v4

      - name: Caché de Herramientas
        id: cache-motor
        uses: actions/cache@v4
        with:
          path: motor_ps4/
          key: motor-ps4-v7-underground

      - name: Instalar Dependencias (Con jq y Proxy Utils)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine64 wine32 xvfb git curl jq unzip

      - name: Configurar Motor (Caza Fuera de GitHub)
        if: steps.cache-motor.outputs.cache-hit != 'true'
        run: |
          echo "==> Creando bóveda..."
          mkdir -p motor_ps4/tools motor_ps4/wrapper
          
          echo "==> Descargando FPKG Tools..."
          git clone --depth 1 https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87.git temp_tools || git clone --depth 1 https://github.com/theheroGAC/ps4-fake-pkg-tools.git temp_tools
          cp -r temp_tools/* motor_ps4/tools/
          
          echo "==> Misión: Conseguir WebKit Wrapper fuera de GitHub..."
          FOUND=0
          
          # TÁCTICA 1: Radar en GitLab (Refugio de la Scene)
          echo "[*] Escaneando API pública de GitLab..."
          REPOS=$(curl -s "https://gitlab.com/api/v4/projects?search=ps4-mac-pkg-builder" | jq -r '.[].http_url_to_repo' 2>/dev/null)
          REPOS2=$(curl -s "https://gitlab.com/api/v4/projects?search=ps4-web-wrapper" | jq -r '.[].http_url_to_repo' 2>/dev/null)
          
          for repo in $REPOS $REPOS2; do
            if [ -z "$repo" ] || [ "$repo" == "null" ]; then continue; fi
            echo "    -> Probando: $repo"
            rm -rf temp_wrap
            if git clone --depth 1 "$repo" temp_wrap -q 2>/dev/null; then
              EBOOT=$(find temp_wrap -name "eboot.bin" | head -n 1)
              # Validación de peso: Si pesa más de 1MB, es el motor real
              if [ -n "$EBOOT" ] && [ $(stat -c%s "$EBOOT") -gt 1000000 ]; then
                echo "[+] ¡BINGO! Motor pesado y real rescatado de GitLab."
                FOUND=1
                break
              fi
            fi
          done
          
          # TÁCTICA 2: Túnel Proxy contra Archive.org (Si GitLab falla)
          if [ "$FOUND" -eq 0 ]; then
            echo "[-] GitLab vacío. Activando Táctica 2: Túnel Proxy Anónimo..."
            # URL original codificada
            RAW_URL="https%3A%2F%2Fweb.archive.org%2Fweb%2F20220901000000id_%2Fhttps%3A%2F%2Fgithub.com%2FGkiokan%2Fps4-mac-pkg-builder%2Farchive%2Frefs%2Fheads%2Fmaster.zip"
            
            # Matriz de proxies para evadir el bloqueo de IP
            PROXIES=(
              "https://api.allorigins.win/raw?url=$RAW_URL"
              "https://api.codetabs.com/v1/proxy?quest=$RAW_URL"
              "https://corsproxy.io/?$RAW_URL"
            )
            
            for proxy in "${PROXIES[@]}"; do
              echo "    -> Intentando túnel: $proxy"
              rm -f base.zip temp_wrap
              if curl -sL "$proxy" -o base.zip; then
                if unzip -tq base.zip >/dev/null 2>&1; then
                  unzip -q base.zip -d temp_wrap
                  EBOOT=$(find temp_wrap -name "eboot.bin" | head -n 1)
                  if [ -n "$EBOOT" ] && [ $(stat -c%s "$EBOOT") -gt 1000000 ]; then
                    echo "[+] ¡BINGO! Motor extraído y lavado por túnel proxy."
                    FOUND=1
                    break
                  fi
                fi
              fi
            done
          fi
          
          if [ "$FOUND" -eq 0 ]; then
            echo "[-] Falla Crítica: El archivo ha sido purgado de todas las redes disponibles."
            exit 1
          fi
          
          echo "==> Guardando en la bóveda..."
          cp "$EBOOT" motor_ps4/wrapper/eboot.bin
          SFO_PATH=$(find temp_wrap -name "param.sfo" | head -n 1)
          cp "$(dirname "$SFO_PATH")"/* motor_ps4/wrapper/ 2>/dev/null || true

      - name: Inyectar Tu Tienda HTML
        run: |
          echo "==> Ensamblando piezas desde caché..."
          mkdir -p build_base/sce_sys/about
          
          cp motor_ps4/wrapper/eboot.bin build_base/eboot.bin
          cp -r motor_ps4/wrapper/* build_base/sce_sys/
          
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Generar configuración project.gp4
        run: |
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <application_param>
                <content_id>IV0000-ROXZ00000_00-RONIXZSTORE00000</content_id>
                <title_id>ROXZ00000</title_id>
              </application_param>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF
          
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > build_base/sce_sys/icon0.png

      - name: Compilar PKG Final
        run: |
          echo "==> Empaquetando tienda..."
          TOOL_DIR=$(dirname "$(find motor_ps4/tools -name "orbis-pub-cmd.exe" | head -n 1)")
          xvfb-run -a wine "$TOOL_DIR/orbis-pub-cmd.exe" img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
