name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código de la tienda
        uses: actions/checkout@v4

      - name: Caché de Herramientas (Velocidad Extrema)
        id: cache-motor
        uses: actions/cache@v4
        with:
          path: motor_ps4/
          key: motor-ps4-definitivo

      - name: Instalar Dependencias (Pantalla Virtual)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine64 wine32 xvfb curl unzip git wget

      - name: Configurar Motor (Solo la primera vez)
        if: steps.cache-motor.outputs.cache-hit != 'true'
        run: |
          echo "==> Creando bóveda de caché..."
          mkdir -p motor_ps4/tools
          mkdir -p motor_ps4/wrapper
          
          echo "==> Descargando FPKG Tools..."
          git clone --depth 1 https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87.git temp_tools || git clone --depth 1 https://github.com/theheroGAC/ps4-fake-pkg-tools.git temp_tools
          cp -r temp_tools/* motor_ps4/tools/
          
          echo "==> Rescatando WebKit Wrapper (Archive.org)..."
          # Wget con User-Agent falso para que Archive.org no nos bloquee
          wget -U "Mozilla/5.0" -qO base.zip "https://web.archive.org/web/20220901000000id_/https://github.com/Gkiokan/ps4-mac-pkg-builder/archive/refs/heads/master.zip"
          unzip -q base.zip
          
          EBOOT_PATH=$(find ps4-mac-pkg-builder-master -name "eboot.bin" | head -n 1)
          SFO_PATH=$(find ps4-mac-pkg-builder-master -name "param.sfo" | head -n 1)
          
          cp "$EBOOT_PATH" motor_ps4/wrapper/eboot.bin
          SFO_DIR=$(dirname "$SFO_PATH")
          cp -r "$SFO_DIR"/* motor_ps4/wrapper/

      - name: Inyectar Tu Tienda HTML
        run: |
          echo "==> Ensamblando piezas desde caché..."
          mkdir -p build_base/sce_sys/about
          
          # Sacar motor de la bóveda
          cp motor_ps4/wrapper/eboot.bin build_base/eboot.bin
          cp -r motor_ps4/wrapper/* build_base/sce_sys/
          
          # Inyectar tus archivos
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Generar configuración project.gp4
        run: |
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <application_param>
                <content_id>IV0000-ROXZ00000_00-RONIXZSTORE00000</content_id>
                <title_id>ROXZ00000</title_id>
              </application_param>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF
          
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > build_base/sce_sys/icon0.png

      - name: Compilar PKG Final
        run: |
          echo "==> Empaquetando tienda..."
          TOOL_DIR=$(dirname "$(find motor_ps4/tools -name "orbis-pub-cmd.exe" | head -n 1)")
          xvfb-run -a wine "$TOOL_DIR/orbis-pub-cmd.exe" img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
