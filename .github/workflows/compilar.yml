name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar tu código
        uses: actions/checkout@v4

      - name: Descargar herramientas públicas FPKG
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip

          # Descargar tools públicas verificadas
          wget -qO tools.zip https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5/ToolchainLinux.zip || true
          
          # Crear directorio base de compilación
          mkdir -p build_base/sce_sys/about

      - name: Generar eboot.bin y sce_sys mínimos
        run: |
          # Crear eboot stub en blanco si no existe
          touch build_base/eboot.bin
          
          # Crear icon0 genérico (1x1 transparente PNG)
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > build_base/sce_sys/icon0.png

      - name: Inyectar Código Fuente
        run: |
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Crear param.sfo
        run: |
          # Formato básico para app WebKit de PS4
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <application_param>
                <content_id>IV0000-ROXZ00000_00-RONIXZSTORE00000</content_id>
                <title_id>ROXZ00000</title_id>
              </application_param>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF

      - name: Compilar PKG usando pkg-builder-action
        uses: PlayOpen/ps4-pkg-builder-action@v1
        with:
          gp4_file: 'project.gp4'
          output_pkg: 'RonixzStore.pkg'

      - name: Entregar el PKG Final
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
