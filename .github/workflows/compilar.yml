name: Compilar Tienda PS4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código de la tienda
        uses: actions/checkout@v4

      - name: Configurar Caché (Salto a la Velocidad de la Luz)
        id: cache-motor
        uses: actions/cache@v4
        with:
          path: |
            tools/
            build_base/
          key: motor-ps4-v1

      - name: Instalar Dependencias del Sistema
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine64 wine32 aria2 unzip git

      - name: Descargar Motor a Máxima Velocidad (Solo 1ra vez)
        if: steps.cache-motor.outputs.cache-hit != 'true'
        run: |
          echo "==> Acelerando descargas con 16 conexiones simultáneas..."
          
          # Cazar herramientas FPKG
          TOOLS_REPOS=(
            "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87.git"
            "https://github.com/theheroGAC/ps4-fake-pkg-tools.git"
            "https://github.com/illusion0001/ps4-fake-pkg-tools.git"
          )
          for repo in "${TOOLS_REPOS[@]}"; do
            if git clone --depth 1 "$repo" tools_fpkg; then break; fi
          done
          mkdir -p tools
          find tools_fpkg -name "orbis-pub-cmd.exe" -exec cp {} tools/ \;
          
          # Cazar WebKit base (16 hilos contra archive.org)
          aria2c -x 16 -s 16 -k 1M "https://web.archive.org/web/20220901000000id_/https://github.com/Gkiokan/ps4-mac-pkg-builder/archive/refs/heads/master.zip" -o base.zip
          unzip -q base.zip
          
          mkdir -p build_base/sce_sys/about
          cp -r ps4-mac-pkg-builder-master/pkg-build/sce_sys/* build_base/sce_sys/
          cp ps4-mac-pkg-builder-master/pkg-build/eboot.bin build_base/

      - name: Inyectar Tu Tienda
        run: |
          # Actualiza los archivos web frescos
          cp index.html build_base/
          cp style.css build_base/
          cp app.js build_base/
          cp database.js build_base/

      - name: Escribir configuration project.gp4
        run: |
          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ps4_project fmt_ver="1000" version="1.0.0">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2023-01-01 00:00:00</volume_ts>
              <package_version>01.00</package_version>
              <application_param>
                <content_id>IV0000-ROXZ00000_00-RONIXZSTORE00000</content_id>
                <title_id>ROXZ00000</title_id>
              </application_param>
              <directory target_path="/">
                <file targ_path="index.html" src_path="build_base/index.html"/>
                <file targ_path="style.css" src_path="build_base/style.css"/>
                <file targ_path="app.js" src_path="build_base/app.js"/>
                <file targ_path="database.js" src_path="build_base/database.js"/>
                <file targ_path="eboot.bin" src_path="build_base/eboot.bin"/>
                <directory target_path="sce_sys">
                  <file targ_path="icon0.png" src_path="build_base/sce_sys/icon0.png"/>
                  <file targ_path="param.sfo" src_path="build_base/sce_sys/param.sfo"/>
                </directory>
              </directory>
            </volume>
          </ps4_project>
          EOF
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > build_base/sce_sys/icon0.png

      - name: Compilar PKG Final
        run: |
          wine tools/orbis-pub-cmd.exe img_create --oformat pkg project.gp4 RonixzStore.pkg

      - name: Entregar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: Ronixz_Store_PS4
          path: RonixzStore.pkg
